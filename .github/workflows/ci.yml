name: warehouse-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: warehouse_test
          POSTGRES_PASSWORD: isolated_ci_password
          POSTGRES_DB: warehouse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
        env:
          WAREHOUSE_TEST_DATABASE_URL: postgresql://warehouse_test:isolated_ci_password@127.0.0.1:5432/warehouse_test
      - run: npm run build
      - run: npm run smoke:production
